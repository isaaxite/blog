<h1 class="post-title" itemprop="name headline">404 - Not Found</h1><div class="post-meta-container"></div></header><div class="post-body"><p>您访问的页面迷路了，即将为您跳转回<a href="/blog/">主页</a></p><p>或者，试试搜索这些相近的文章？</p><ul id="suggestions" class="suggestion-list"><li>正在寻找相似文章...</li></ul><script>(function() {
  // 获取当前错误的路径
  var path = window.location.pathname;
  console.log('当前错误路径:', path);

  // 获取当前页面显示的域名，用于构建完整链接
  var baseUrl = window.location.origin;

  // 1. 设置定时跳转（可选，比如5秒后跳转到主页）
  // setTimeout(function() {
  //   window.location.href = '/blog/'; // 修改为你主页的路径
  // }, 15000); // 15000毫秒 = 15秒

  // 2. 尝试从 sitemap 获取推荐文章
  var suggestionList = document.getElementById('suggestions');

  // 获取 sitemap 文件
  fetch('/blog/sitemap.xml') // 确认你的 sitemap 路径是否正确
    .then(response => response.text())
    .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
    .then(data => {
      var urls = data.querySelectorAll('url loc');
      var suggestions = [];
      var pathSegments = path.split('/').filter(s => s); // 获取路径的关键词

      // 简单的匹配规则：遍历所有链接，找到路径中包含当前路径关键词的链接
      urls.forEach(function(locNode) {
        var url = locNode.textContent;
        // 跳过自身（404页面）和主页
        if (url.includes('/404.html') || url === baseUrl + '/blog/') return; 

        // 关键词匹配逻辑：如果当前错误路径的任一段落出现在文章链接中，就视为相关
        pathSegments.forEach(segment => {
          if (segment.length > 3 && url.includes(segment) && !suggestions.includes(url)) { // 避免过短关键词和重复
              suggestions.push(url);
          }
        });
      });

      // 显示推荐结果
      if (suggestions.length > 0) {
        suggestionList.innerHTML = ''; // 清空 "正在寻找..."
        suggestions.slice(0, 5).forEach(function(url) { // 最多显示5条
          var li = document.createElement('li');
          var a = document.createElement('a');
          a.href = url;
          // 从链接中提取一个友好的标题（例如取最后一部分）
          var titlePart = url.split('/').filter(s => s).pop().replace(/-/g, ' ') || '相关文章';
          a.textContent = decodeURIComponent(titlePart);
          li.appendChild(a);
          suggestionList.appendChild(li);
        });
      } else {
        suggestionList.innerHTML = '<li>没有找到非常相似的文章，<a href="/blog/">返回主页</a>看看吧。</li>';
      }
  })
  .catch(error => {
    console.error('加载 sitemap 失败:', error);
    suggestionList.innerHTML = '<li>无法加载文章推荐，<a href="/blog/">点击这里返回主页</a>。</li>';
  });
})();</script></div></div></div></main><footer class="footer"><div class="footer-inner"><div class="copyright">&copy; <span itemprop="copyrightYear">2026</span> <span class="with-love"><i class="fa fa-heart"></i> </span><span class="author" itemprop="copyrightHolder">isaac</span></div><div class="powered-by">由 <a href="https://hexo.io/" rel="noopener" target="_blank">Hexo</a> & <a href="https://theme-next.js.org/" rel="noopener" target="_blank">NexT.Gemini</a> 强力驱动</div></div></footer><div class="back-to-top" role="button" aria-label="返回顶部"><i class="fa fa-arrow-up fa-lg"></i> <span>0%</span></div><div class="reading-progress-bar"></div><noscript><div class="noscript-warning">Theme NexT works best with JavaScript enabled</div></noscript><script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js" integrity="sha256-XL2inqUJaslATFnHdJOi9GfQ60on8Wx1C2H8DYiN1xY=" crossorigin="anonymous"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.3/jquery.min.js" integrity="sha256-pvPw+upLPUjgMXY0G+8O0xUf+/Im1MZjXxxgOcBQBXU=" crossorigin="anonymous"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/fancybox/3.5.7/jquery.fancybox.min.js" integrity="sha256-yt2kYMy0w8AbtF89WXb2P1rfjcP/HTHLT7097U8Y5b8=" crossorigin="anonymous"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pangu/4.0.7/pangu.min.js" integrity="sha256-j+yj56cdEY2CwkVtGyz18fNybFGpMGJ8JxG3GSyO2+I=" crossorigin="anonymous"></script><script src="/js/comments.js"></script><script src="/js/utils.js"></script><script src="/js/motion.js"></script><script src="/js/next-boot.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/hexo-generator-searchdb/1.4.1/search.js" integrity="sha256-1kfA5uHPf65M5cphT2dvymhkuyHPQp5A53EGZOnOLmc=" crossorigin="anonymous"></script><script src="/js/third-party/search/local-search.js"></script><script class="next-config" data-name="mermaid" type="application/json">{"enable":true,"theme":{"light":"default","dark":"dark"},"js
